<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Aviso de atualização do site System GFG." />
    <title>Atualização do Site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        color-scheme: dark;
        font-family: "Anton", Impact, sans-serif;
        color: #f3f7fb;
        background: #050505;
      }

      body {
        min-height: 100vh;
        display: flex;
        place-items: center;
        justify-content: center;
        margin: 0;
        padding: 32px 20px;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 68% 34%, rgba(255, 255, 255, 0.1), transparent 30%),
          radial-gradient(circle at 10% 90%, rgba(180, 180, 180, 0.08), transparent 28%),
          linear-gradient(135deg, #050505 0%, #171717 52%, #000000 100%);
        color: #f3f7fb;
      }

      .cartao-atualizacao {
        width: min(100%, 700px);
        padding: clamp(32px, 7vw, 56px) clamp(24px, 6vw, 48px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        background: linear-gradient(145deg, rgba(44, 44, 44, 0.94), rgba(15, 15, 15, 0.96));
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        text-align: center;
      }

      .selo-atualizacao {
        display: inline-block;
        margin-bottom: 22px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(216, 222, 230, 0.32);
        background: rgba(180, 190, 200, 0.12);
        color: #d8dee6;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        font-size: clamp(1rem, 2vw, 1.35rem);
        color: #d2d9e2;
        line-height: 1.5;
      }

      .contagem-regressiva {
        display: inline-block;
        margin-top: 24px;
        padding: 14px 24px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: linear-gradient(135deg, #767676, #2f2f2f);
        color: #f5f7fa;
        font-weight: 700;
        font-size: clamp(1.1rem, 2vw, 1.6rem);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.32);
      }

      @media (max-width: 480px) {
        .cartao-atualizacao {
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="cartao-atualizacao">
      <div class="selo-atualizacao">Sistema em manutenção</div>
      <h1>Nosso site será atualizado</h1>
      <p>Estamos preparando uma nova experiência para você. Atualização prevista para hoje às 18:00.</p>
      <div class="contagem-regressiva" id="contagemRegressiva" role="timer" aria-live="off">Calculando...</div>
      <script>
        const contagemRegressiva = document.getElementById("contagemRegressiva");
        const horarioPrevisto = new Date();
        horarioPrevisto.setHours(18, 0, 0, 0);

        let temporizador;

        const atualizarContagem = () => {
          const milissegundosRestantes = horarioPrevisto.getTime() - Date.now();

          if (milissegundosRestantes <= 0) {
            contagemRegressiva.textContent = "Horário previsto alcançado";
            window.clearInterval(temporizador);
            return;
          }

          const segundosRestantes = Math.ceil(milissegundosRestantes / 1000);
          const dias = Math.floor(segundosRestantes / 86400);
          const horas = String(Math.floor((segundosRestantes % 86400) / 3600)).padStart(2, "0");
          const minutos = String(Math.floor((segundosRestantes % 3600) / 60)).padStart(2, "0");
          const segundos = String(segundosRestantes % 60).padStart(2, "0");

          contagemRegressiva.textContent = `Faltam ${dias}d ${horas}:${minutos}:${segundos}`;
        };

        atualizarContagem();
        temporizador = window.setInterval(atualizarContagem, 1000);
      </script>
    </main>
  </body>
</html>
